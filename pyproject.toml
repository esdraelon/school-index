# Build backend: setuptools (src layout), mirroring school-info-adapter —
# its editable-install + package-dir handling is the estate's proven shape.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-index"
version = "0.1.0"
description = "School Index: resources harvested from the school adapter's MCP contract, extracted to text, chunked and embedded, and served as a search MCP on hal9k."
requires-python = ">=3.12"
# Runtime dependencies, declared per milestone — only what the code
# imports. M1 (corpus_sync): the official MCP Python SDK, client side
# (the harvester consumes the school adapter through its MCP contract;
# same pin as the adapter), and httpx (the download transport, imported
# directly by corpus_sync.fetch). M2 (doc_extract): pypdf, the PDF
# text layer (pure-Python — no native wheel to strand on hal9k's ARM).
# M3 (embed_index): onnxruntime + tokenizers run BAAI/bge-small-en-v1.5
# directly (no torch, no fastembed — the lean route, with aarch64 wheels
# for hal9k), numpy does the vector math (and the brute-force fallback
# store), sqlite-vec is the design's vector store (vec0 extension).
dependencies = [
    "mcp>=1.16,<2",
    # M4 (index_mcp): uvicorn serves the search MCP in production.
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pypdf>=5",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
# `coverage` is declared explicitly (not left to pytest-cov's transitive
# pull): scripts/verify.sh drives the coverage CLI directly, so the tool
# is a first-class dev dependency — the adapter declares it the same way.
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "mypy",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# --- Quality gates (all enforced by scripts/verify.sh) ---

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

# Coverage gate: >=90% line coverage of the school_index package,
# measured over the unit tests only. `coverage report` exits non-zero
# below this.
[tool.coverage.run]
source = ["school_index"]
# Entry shims (`python -m ...`) are omitted from measurement: their
# three lines are an interpreter guard, and coverage's tracer does not
# attribute in-process re-execution of a __main__ file under pytest.
# Their behavior is proven instead by the entry-point tests (real
# subprocess exit codes + in-process SystemExit propagation). The
# adapter's identical shim lives under the same convention.
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

# Type gate: mypy strict over the whole package.
[tool.mypy]
strict = true
